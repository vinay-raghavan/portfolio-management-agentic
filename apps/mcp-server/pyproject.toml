[project]
name = "portfolio-mcp-server"
version = "0.1.0"
description = "Policy-enforced MCP server for portfolio and paper-trading tools"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.13.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_mcp"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "../../packages/policy",
    "../../packages/domain",
]
