name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.13"
  PYTHON_VERSION: "3.13"

jobs:
  root-contracts:
    name: Root contracts and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install root dependencies
        run: uv sync --frozen --dev

      - name: Run root tests
        run: uv run pytest tests

      - name: Verify model eval preflight is credential-gated
        run: uv run python scripts/run_agent_evals.py preflight --json

  agent-service:
    name: Agent service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install agent-service dependencies
        run: uv sync --frozen --dev

      - name: Run agent-service tests
        run: uv run pytest tests/unit tests/integration

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Audit web dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck web console
        run: npm run typecheck

      - name: Build web console
        run: npm run build

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build runtime images
        run: docker compose build agent-service paper-execution-worker mcp-server web

      - name: Start runtime services
        run: docker compose up -d agent-service paper-execution-worker mcp-server web

      - name: Verify agent service readiness
        run: |
          curl --retry 20 --retry-all-errors --retry-delay 2 --fail \
            http://127.0.0.1:8000/docs >/dev/null

      - name: Verify web console readiness
        run: |
          curl --retry 20 --retry-all-errors --retry-delay 2 --fail \
            http://127.0.0.1:3000 >/dev/null

      - name: Verify MCP safe tool catalog
        run: |
          uv run python - <<'PY'
          import asyncio
          import sys
          from pathlib import Path

          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          root = Path.cwd()
          for path in (
              root / "apps/mcp-server",
              root / "packages/policy",
              root / "packages/domain",
          ):
              sys.path.insert(0, str(path))

          from portfolio_mcp.tools import EXPOSED_TOOL_NAMES

          FORBIDDEN = {"place_live_order", "get_broker_trading_token"}

          async def main() -> None:
              async with streamable_http_client("http://127.0.0.1:8081/mcp") as (
                  read,
                  write,
                  _,
              ):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      result = await session.list_tools()
                      tool_names = {tool.name for tool in result.tools}
                      assert tool_names == EXPOSED_TOOL_NAMES, tool_names
                      assert tool_names.isdisjoint(FORBIDDEN), tool_names

          asyncio.run(main())
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color agent-service paper-execution-worker mcp-server web

      - name: Stop runtime services
        if: always()
        run: docker compose down --volumes --remove-orphans
