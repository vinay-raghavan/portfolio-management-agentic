name: Eval baseline

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider for eval generation"
        required: true
        default: gemini
        type: choice
        options:
          - gemini
          - claude
          - openai_compatible
          - ollama
      fail_on_skip:
        description: "Fail when model credentials are not configured"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: eval-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.8.13"
  PYTHON_VERSION: "3.13"
  LLM_PROVIDER: ${{ inputs.provider }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}

jobs:
  model-eval-baseline:
    name: Credentialed model eval baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install root dependencies
        run: uv sync --frozen --dev

      - name: Install agents-cli
        run: uv tool install google-agents-cli

      - name: Configure Google application credentials
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            umask 077
            CREDENTIALS_FILE="$RUNNER_TEMP/google-application-credentials.json"
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$CREDENTIALS_FILE"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"
          fi

      - name: Preflight eval credentials
        run: uv run python scripts/run_agent_evals.py preflight --json

      - name: Run eval and deterministic triage
        run: |
          set +e
          RUN_ARGS=()
          if [ "${{ inputs.fail_on_skip }}" = "true" ]; then
            RUN_ARGS+=(--fail-on-skip)
          fi
          uv run python scripts/run_agent_evals.py run "${RUN_ARGS[@]}"
          RUN_STATUS=$?
          uv run python scripts/run_agent_evals.py triage --json
          TRIAGE_STATUS=$?
          if [ "$TRIAGE_STATUS" -ne 0 ]; then
            exit "$TRIAGE_STATUS"
          fi
          exit "$RUN_STATUS"

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agentic-eval-artifacts
          path: apps/agent-service/artifacts/evals
          if-no-files-found: warn
