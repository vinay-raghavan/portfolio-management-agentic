name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish container images to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/portfolio-management-agentic

jobs:
  verify-eval-artifact:
    name: Verify commit-bound eval artifact
    runs-on: ubuntu-latest
    steps:
      - name: Require successful eval artifact for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="portfolio-agentic-eval-artifacts-${GITHUB_SHA}"
          export ARTIFACT_NAME
          ARTIFACT_RUN_ID="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              --paginate \
              --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false and .workflow_run.head_sha == env.GITHUB_SHA) | .workflow_run.id' \
              | head -n 1
          )"
          if [ -z "$ARTIFACT_RUN_ID" ]; then
            echo "Missing successful eval artifact named ${ARTIFACT_NAME} for ${GITHUB_SHA}."
            echo "Run .github/workflows/eval-baseline.yml successfully for this exact candidate commit before CD."
            exit 1
          fi
          RUN_CONCLUSION="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" \
              --jq '.conclusion'
          )"
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "Eval artifact workflow run did not conclude successfully: ${RUN_CONCLUSION}."
            exit 1
          fi
          ARTIFACT_DIR="$RUNNER_TEMP/eval-artifact"
          gh run download "$ARTIFACT_RUN_ID" \
            --name "$ARTIFACT_NAME" \
            --dir "$ARTIFACT_DIR"
          python - "$ARTIFACT_DIR" "$GITHUB_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          artifact_dir = Path(sys.argv[1])
          expected_commit = sys.argv[2]

          def load_required(name: str) -> dict:
              matches = list(artifact_dir.rglob(name))
              if not matches:
                  raise SystemExit(f"Missing required eval artifact file: {name}")
              with matches[0].open() as handle:
                  return json.load(handle)

          baseline = load_required("baseline-summary.json")
          triage = load_required("triage-report.json")
          if baseline.get("candidate_commit") != expected_commit:
              raise SystemExit("Eval baseline artifact is not bound to this commit.")
          if triage.get("candidate_commit") != expected_commit:
              raise SystemExit("Eval triage artifact is not bound to this commit.")
          if baseline.get("status") != "completed":
              raise SystemExit("Eval baseline did not complete successfully.")
          if triage.get("status") != "passed":
              raise SystemExit("Eval triage did not pass.")

          readiness = triage.get("submission_readiness") or {}
          if readiness.get("status") != "ready_for_capstone_submission":
              raise SystemExit("Eval triage is not ready for capstone submission.")

          metric_coverage = (triage.get("summary") or {}).get("metric_coverage") or {}
          if metric_coverage.get("expected_total_metric_results") != 45:
              raise SystemExit("Eval artifact does not declare the required 45 metrics.")
          if metric_coverage.get("observed_total_metric_results") != 45:
              raise SystemExit("Eval artifact does not contain exact 45/45 metric coverage.")
          if (triage.get("summary") or {}).get("failure_count") != 0:
              raise SystemExit("Eval triage contains failures.")
          if (triage.get("summary") or {}).get("critical_failure_count") != 0:
              raise SystemExit("Eval triage contains critical failures.")
          if not list(artifact_dir.rglob("traces/*.json")):
              raise SystemExit("Eval artifact is missing trace JSON files.")
          if not list(artifact_dir.rglob("grade-results/*.json")):
              raise SystemExit("Eval artifact is missing grade-result JSON files.")
          print("Eval artifact content verified for exact commit.")
          PY

  build-images:
    name: Build and publish images
    needs: verify-eval-artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-service
            dockerfile: apps/agent-service/Dockerfile
          - service: mcp-server
            dockerfile: apps/mcp-server/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.inputs.publish_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || github.event.inputs.publish_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container Images

            Images are published to GitHub Container Registry:

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-management-agentic-agent-service:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-management-agentic-mcp-server:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-management-agentic-web:${{ github.ref_name }}
            ```

            These images run the paper-trading agent service, policy-enforced MCP server, and thin web console. No live-trading or broker-token workflow is enabled by this release.
