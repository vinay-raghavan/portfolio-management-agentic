name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish container images to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/portfolio-management-agentic

jobs:
  build-images:
    name: Build and publish images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-service
            dockerfile: apps/agent-service/Dockerfile
          - service: mcp-server
            dockerfile: apps/mcp-server/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.inputs.publish_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || github.event.inputs.publish_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container Images

            Images are published to GitHub Container Registry:

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-management-agentic-agent-service:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-management-agentic-mcp-server:${{ github.ref_name }}
            ```

            These images run the paper-trading agent service and the policy-enforced MCP server only. No live-trading or broker-token workflow is enabled by this release.
