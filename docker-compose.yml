services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_agentic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-portfolio} -d $${POSTGRES_DB:-portfolio_agentic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: infra/db/Dockerfile
    environment:
      PORTFOLIO_DATABASE_URL: ${PORTFOLIO_DATABASE_URL:-postgresql+psycopg://portfolio:portfolio-dev-password@postgres:5432/portfolio_agentic}
    command: uv run alembic -c infra/db/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-False}
      ENABLE_CLOUD_TELEMETRY: ${ENABLE_CLOUD_TELEMETRY:-false}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST:-}
      OLLAMA_STATUS_TIMEOUT_SECONDS: ${OLLAMA_STATUS_TIMEOUT_SECONDS:-1.5}
      OLLAMA_AVAILABLE_MODEL_DIGESTS: ${OLLAMA_AVAILABLE_MODEL_DIGESTS:-}
      MODEL_CONTEXT_WINDOW_TOKENS: ${MODEL_CONTEXT_WINDOW_TOKENS:-8192}
      MODEL_SUPPORTS_TOOL_USE: ${MODEL_SUPPORTS_TOOL_USE:-true}
      MODEL_SUPPORTS_STRUCTURED_OUTPUTS: ${MODEL_SUPPORTS_STRUCTURED_OUTPUTS:-true}
      MODEL_TUNING_CANDIDATES: ${MODEL_TUNING_CANDIDATES:-llama3.1:8b,gemma:7b,gemma4:12b}
      MODEL_TUNING_DEV_SET: ${MODEL_TUNING_DEV_SET:-agent-service-dev}
      MODEL_TUNING_HOLDOUT_SET: ${MODEL_TUNING_HOLDOUT_SET:-agent-service-sealed}
      AGENT_TOOL_TRANSPORT: ${AGENT_TOOL_TRANSPORT:-mcp}
      AGENT_MCP_URL: ${AGENT_MCP_URL:-http://mcp-server:8081/mcp}
      PORTFOLIO_STORAGE_BACKEND: ${PORTFOLIO_STORAGE_BACKEND:-postgres}
      PORTFOLIO_DATABASE_URL: ${PORTFOLIO_DATABASE_URL:-postgresql+psycopg://portfolio:portfolio-dev-password@postgres:5432/portfolio_agentic}
      PORTFOLIO_TENANT_ID: ${PORTFOLIO_TENANT_ID:-11111111-1111-1111-1111-111111111111}
      PAPER_EXECUTION_KILL_SWITCH: ${PAPER_EXECUTION_KILL_SWITCH:-false}
      FYERS_CONNECTOR_KILL_SWITCH: ${FYERS_CONNECTOR_KILL_SWITCH:-false}
      MODEL_ROUTE_KILL_SWITCH: ${MODEL_ROUTE_KILL_SWITCH:-false}
      PROVIDER_REFRESH_SCHEDULER_KILL_SWITCH: ${PROVIDER_REFRESH_SCHEDULER_KILL_SWITCH:-false}
      PORTFOLIO_RESEARCH_STORE_BACKEND: ${PORTFOLIO_RESEARCH_STORE_BACKEND:-fixture}
      PORTFOLIO_RESEARCH_TENANT_ID: ${PORTFOLIO_RESEARCH_TENANT_ID:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000,http://localhost:8000}
      PAPER_LEDGER_DB_PATH: ${PAPER_LEDGER_DB_PATH:-/data/paper-ledger.db}
      MARKET_DATA_DB_PATH: ${MARKET_DATA_DB_PATH:-/data/market-data.db}
      PROVIDER_CONFIG_DB_PATH: ${PROVIDER_CONFIG_DB_PATH:-/data/provider-config.db}
      PORTFOLIO_MARKET_DATA_PROVIDER: ${PORTFOLIO_MARKET_DATA_PROVIDER:-fixture}
      PORTFOLIO_MARKET_DATA_JSON_PATH: ${PORTFOLIO_MARKET_DATA_JSON_PATH:-}
      PORTFOLIO_UNIVERSE_PROVIDER: ${PORTFOLIO_UNIVERSE_PROVIDER:-fixture}
      PORTFOLIO_UNIVERSE_JSON_PATH: ${PORTFOLIO_UNIVERSE_JSON_PATH:-}
      PORTFOLIO_FUNDAMENTALS_PROVIDER: ${PORTFOLIO_FUNDAMENTALS_PROVIDER:-fixture}
      PORTFOLIO_FUNDAMENTALS_JSON_PATH: ${PORTFOLIO_FUNDAMENTALS_JSON_PATH:-}
      PORTFOLIO_SENTIMENT_PROVIDER: ${PORTFOLIO_SENTIMENT_PROVIDER:-fixture}
      PORTFOLIO_SENTIMENT_JSON_PATH: ${PORTFOLIO_SENTIMENT_JSON_PATH:-}
      PORTFOLIO_VOLATILITY_PROVIDER: ${PORTFOLIO_VOLATILITY_PROVIDER:-fixture}
      PORTFOLIO_VOLATILITY_JSON_PATH: ${PORTFOLIO_VOLATILITY_JSON_PATH:-}
      PORTFOLIO_MACRO_PROVIDER: ${PORTFOLIO_MACRO_PROVIDER:-fixture}
      PORTFOLIO_MACRO_JSON_PATH: ${PORTFOLIO_MACRO_JSON_PATH:-}
    ports:
      - "8000:8000"
    volumes:
      - paper-ledger-data:/data
    depends_on:
      mcp-server:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  paper-execution-worker:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    command: uv run python ../../scripts/process_paper_execution_queue.py --daemon
    environment:
      PORTFOLIO_STORAGE_BACKEND: ${PORTFOLIO_STORAGE_BACKEND:-postgres}
      PORTFOLIO_DATABASE_URL: ${PORTFOLIO_DATABASE_URL:-postgresql+psycopg://portfolio:portfolio-dev-password@postgres:5432/portfolio_agentic}
      PORTFOLIO_TENANT_IDS: ${PORTFOLIO_TENANT_IDS:-}
      PORTFOLIO_TENANT_ID: ${PORTFOLIO_TENANT_ID:-11111111-1111-1111-1111-111111111111}
      PAPER_EXECUTION_KILL_SWITCH: ${PAPER_EXECUTION_KILL_SWITCH:-false}
      PAPER_EXECUTION_WORKER_ID: ${PAPER_EXECUTION_WORKER_ID:-paper-execution-worker-1}
      PAPER_EXECUTION_WORKER_MAX_ITEMS: ${PAPER_EXECUTION_WORKER_MAX_ITEMS:-100}
      PAPER_EXECUTION_WORKER_IDLE_SLEEP_SECONDS: ${PAPER_EXECUTION_WORKER_IDLE_SLEEP_SECONDS:-5}
      PAPER_EXECUTION_WORKER_SCHEDULE_BACKOFF_SECONDS: ${PAPER_EXECUTION_WORKER_SCHEDULE_BACKOFF_SECONDS:-30}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AGENT_API_URL: ${VITE_AGENT_API_URL:-http://localhost:8000}
    environment:
      VITE_AGENT_API_URL: ${VITE_AGENT_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      agent-service:
        condition: service_started

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8081}
      MCP_STREAMABLE_HTTP_PATH: ${MCP_STREAMABLE_HTTP_PATH:-/mcp}
      MCP_STATELESS_HTTP: ${MCP_STATELESS_HTTP:-true}
      PORTFOLIO_STORAGE_BACKEND: ${PORTFOLIO_STORAGE_BACKEND:-postgres}
      PORTFOLIO_DATABASE_URL: ${PORTFOLIO_DATABASE_URL:-postgresql+psycopg://portfolio:portfolio-dev-password@postgres:5432/portfolio_agentic}
      PORTFOLIO_TENANT_ID: ${PORTFOLIO_TENANT_ID:-11111111-1111-1111-1111-111111111111}
      PORTFOLIO_RESEARCH_STORE_BACKEND: ${PORTFOLIO_RESEARCH_STORE_BACKEND:-fixture}
      PORTFOLIO_RESEARCH_TENANT_ID: ${PORTFOLIO_RESEARCH_TENANT_ID:-}
      PROVIDER_REFRESH_SCHEDULER_KILL_SWITCH: ${PROVIDER_REFRESH_SCHEDULER_KILL_SWITCH:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PAPER_LEDGER_DB_PATH: ${PAPER_LEDGER_DB_PATH:-/data/paper-ledger.db}
      MARKET_DATA_DB_PATH: ${MARKET_DATA_DB_PATH:-/data/market-data.db}
      PROVIDER_CONFIG_DB_PATH: ${PROVIDER_CONFIG_DB_PATH:-/data/provider-config.db}
      PORTFOLIO_MARKET_DATA_PROVIDER: ${PORTFOLIO_MARKET_DATA_PROVIDER:-fixture}
      PORTFOLIO_MARKET_DATA_JSON_PATH: ${PORTFOLIO_MARKET_DATA_JSON_PATH:-}
      PORTFOLIO_UNIVERSE_PROVIDER: ${PORTFOLIO_UNIVERSE_PROVIDER:-fixture}
      PORTFOLIO_UNIVERSE_JSON_PATH: ${PORTFOLIO_UNIVERSE_JSON_PATH:-}
      PORTFOLIO_FUNDAMENTALS_PROVIDER: ${PORTFOLIO_FUNDAMENTALS_PROVIDER:-fixture}
      PORTFOLIO_FUNDAMENTALS_JSON_PATH: ${PORTFOLIO_FUNDAMENTALS_JSON_PATH:-}
      PORTFOLIO_SENTIMENT_PROVIDER: ${PORTFOLIO_SENTIMENT_PROVIDER:-fixture}
      PORTFOLIO_SENTIMENT_JSON_PATH: ${PORTFOLIO_SENTIMENT_JSON_PATH:-}
      PORTFOLIO_VOLATILITY_PROVIDER: ${PORTFOLIO_VOLATILITY_PROVIDER:-fixture}
      PORTFOLIO_VOLATILITY_JSON_PATH: ${PORTFOLIO_VOLATILITY_JSON_PATH:-}
      PORTFOLIO_MACRO_PROVIDER: ${PORTFOLIO_MACRO_PROVIDER:-fixture}
      PORTFOLIO_MACRO_JSON_PATH: ${PORTFOLIO_MACRO_JSON_PATH:-}
    ports:
      - "8081:8081"
    volumes:
      - paper-ledger-data:/data
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.3}
    profiles:
      - ollama
    volumes:
      - ollama-data:/root/.ollama

  ollama-model-prepull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.3}
    profiles:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PREPULL_MODEL: ${OLLAMA_PREPULL_MODEL:-llama3.1:8b}
    command: >-
      sh -c 'until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$${OLLAMA_PREPULL_MODEL}"'
    depends_on:
      ollama:
        condition: service_started
    restart: "no"

volumes:
  ollama-data:
  paper-ledger-data:
  postgres-data:
  redis-data:
