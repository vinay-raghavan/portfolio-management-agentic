services:
  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-False}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST:-}
      MODEL_CONTEXT_WINDOW_TOKENS: ${MODEL_CONTEXT_WINDOW_TOKENS:-8192}
      MODEL_SUPPORTS_TOOL_USE: ${MODEL_SUPPORTS_TOOL_USE:-true}
      MODEL_SUPPORTS_STRUCTURED_OUTPUTS: ${MODEL_SUPPORTS_STRUCTURED_OUTPUTS:-true}
      MODEL_TUNING_CANDIDATES: ${MODEL_TUNING_CANDIDATES:-llama3.1:8b,gemma:7b,gemma4:12b}
      MODEL_TUNING_DEV_SET: ${MODEL_TUNING_DEV_SET:-agent-service-dev}
      MODEL_TUNING_HOLDOUT_SET: ${MODEL_TUNING_HOLDOUT_SET:-agent-service-sealed}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000,http://localhost:8000}
      PAPER_LEDGER_DB_PATH: ${PAPER_LEDGER_DB_PATH:-/data/paper-ledger.db}
      MARKET_DATA_DB_PATH: ${MARKET_DATA_DB_PATH:-/data/market-data.db}
      PROVIDER_CONFIG_DB_PATH: ${PROVIDER_CONFIG_DB_PATH:-/data/provider-config.db}
      PORTFOLIO_MARKET_DATA_PROVIDER: ${PORTFOLIO_MARKET_DATA_PROVIDER:-fixture}
      PORTFOLIO_MARKET_DATA_JSON_PATH: ${PORTFOLIO_MARKET_DATA_JSON_PATH:-}
      PORTFOLIO_UNIVERSE_PROVIDER: ${PORTFOLIO_UNIVERSE_PROVIDER:-fixture}
      PORTFOLIO_UNIVERSE_JSON_PATH: ${PORTFOLIO_UNIVERSE_JSON_PATH:-}
      PORTFOLIO_FUNDAMENTALS_PROVIDER: ${PORTFOLIO_FUNDAMENTALS_PROVIDER:-fixture}
      PORTFOLIO_FUNDAMENTALS_JSON_PATH: ${PORTFOLIO_FUNDAMENTALS_JSON_PATH:-}
      PORTFOLIO_SENTIMENT_PROVIDER: ${PORTFOLIO_SENTIMENT_PROVIDER:-fixture}
      PORTFOLIO_SENTIMENT_JSON_PATH: ${PORTFOLIO_SENTIMENT_JSON_PATH:-}
      PORTFOLIO_VOLATILITY_PROVIDER: ${PORTFOLIO_VOLATILITY_PROVIDER:-fixture}
      PORTFOLIO_VOLATILITY_JSON_PATH: ${PORTFOLIO_VOLATILITY_JSON_PATH:-}
      PORTFOLIO_MACRO_PROVIDER: ${PORTFOLIO_MACRO_PROVIDER:-fixture}
      PORTFOLIO_MACRO_JSON_PATH: ${PORTFOLIO_MACRO_JSON_PATH:-}
    ports:
      - "8000:8000"
    volumes:
      - paper-ledger-data:/data
    depends_on:
      - mcp-server

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AGENT_API_URL: ${VITE_AGENT_API_URL:-http://localhost:8000}
    environment:
      VITE_AGENT_API_URL: ${VITE_AGENT_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - agent-service

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8081}
      MCP_STREAMABLE_HTTP_PATH: ${MCP_STREAMABLE_HTTP_PATH:-/mcp}
      MCP_STATELESS_HTTP: ${MCP_STATELESS_HTTP:-true}
      PAPER_LEDGER_DB_PATH: ${PAPER_LEDGER_DB_PATH:-/data/paper-ledger.db}
      MARKET_DATA_DB_PATH: ${MARKET_DATA_DB_PATH:-/data/market-data.db}
      PROVIDER_CONFIG_DB_PATH: ${PROVIDER_CONFIG_DB_PATH:-/data/provider-config.db}
      PORTFOLIO_MARKET_DATA_PROVIDER: ${PORTFOLIO_MARKET_DATA_PROVIDER:-fixture}
      PORTFOLIO_MARKET_DATA_JSON_PATH: ${PORTFOLIO_MARKET_DATA_JSON_PATH:-}
      PORTFOLIO_UNIVERSE_PROVIDER: ${PORTFOLIO_UNIVERSE_PROVIDER:-fixture}
      PORTFOLIO_UNIVERSE_JSON_PATH: ${PORTFOLIO_UNIVERSE_JSON_PATH:-}
      PORTFOLIO_FUNDAMENTALS_PROVIDER: ${PORTFOLIO_FUNDAMENTALS_PROVIDER:-fixture}
      PORTFOLIO_FUNDAMENTALS_JSON_PATH: ${PORTFOLIO_FUNDAMENTALS_JSON_PATH:-}
      PORTFOLIO_SENTIMENT_PROVIDER: ${PORTFOLIO_SENTIMENT_PROVIDER:-fixture}
      PORTFOLIO_SENTIMENT_JSON_PATH: ${PORTFOLIO_SENTIMENT_JSON_PATH:-}
      PORTFOLIO_VOLATILITY_PROVIDER: ${PORTFOLIO_VOLATILITY_PROVIDER:-fixture}
      PORTFOLIO_VOLATILITY_JSON_PATH: ${PORTFOLIO_VOLATILITY_JSON_PATH:-}
      PORTFOLIO_MACRO_PROVIDER: ${PORTFOLIO_MACRO_PROVIDER:-fixture}
      PORTFOLIO_MACRO_JSON_PATH: ${PORTFOLIO_MACRO_JSON_PATH:-}
    ports:
      - "8081:8081"
    volumes:
      - paper-ledger-data:/data

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.3}
    profiles:
      - ollama
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
  paper-ledger-data:
