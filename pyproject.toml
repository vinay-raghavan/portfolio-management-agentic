[project]
name = "portfolio-management-agentic"
version = "0.1.0"
description = "Agentic portfolio and paper-trading capstone monorepo"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "packages/policy",
    "packages/domain",
    "packages/model-provider",
    "packages/agent-platform",
    "apps/mcp-server",
]
testpaths = [
    "tests",
]

