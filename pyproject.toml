[project]
name = "portfolio-management-agentic"
version = "0.1.0"
description = "Agentic portfolio and paper-trading capstone monorepo"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "alembic>=1.16,<2",
    "mcp>=1.13.0,<2.0.0",
    "psycopg[binary]>=3.2,<4",
    "pytest>=9.0.2,<10.0.0",
    "sqlalchemy>=2.0,<3",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "packages/policy",
    "packages/domain",
    "packages/harness",
    "packages/model-provider",
    "packages/capabilities",
    "packages/agent-platform",
    "apps/mcp-server",
]
testpaths = [
    "tests",
]
